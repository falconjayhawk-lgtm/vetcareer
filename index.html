  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; }
    .sidebar { width: 200px; min-height: 100vh; background: white; box-shadow: 2px 0 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; }
    .main { margin-left: 200px; min-height: 100vh; padding: 32px; max-width: 900px; }
    .nav-btn { display: block; width: 100%; text-align: left; padding: 10px 16px; border: none; background: none; cursor: pointer; font-size: 14px; color: #4b5563; border-radius: 8px; margin: 2px 0; }

    .nav-btn.active { background: #eff6ff; color: #1d4ed8; font-weight: 600; }

    .btn-secondary { background: #f3f4f6; color: #374151; }

    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: border 0.15s; }
    input:focus, select:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
    label.field-label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .field { margin-bottom: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; margin: 2px; }
    .tag-blue { background: #dbeafe; color: #1d4ed8; }
    .tag-purple { background: #ede9fe; color: #6d28d9; }
    .tag-orange { background: #fed7aa; color: #c2410c; }
    .timeline-line { position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: #bfdbfe; }
    .timeline-dot { position: absolute; left: 4px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; border: 2px solid white; box-shadow: 0 0 0 2px #3b82f6; }
    .timeline-item { position: relative; padding-left: 36px; margin-bottom: 16px; }
    .checklist-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
    .checklist-item:hover { border-color: #93c5fd; background: #eff6ff; }
    .checklist-item.done { background: #f0fdf4; border-color: #86efac; cursor: default; }
    .check-circle { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; }
    .check-circle.done { background: #22c55e; color: white; }
    .check-circle.todo { background: #e5e7eb; }
    .score-circle { width: 110px; height: 110px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
    .gap-high { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .gap-med { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .gap-low { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .gap-good { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
    .spinner { width: 18px; height: 18px; border: 2px solid #bfdbfe; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .resume-preview { border: 1px solid #e5e7eb; border-radius: 8px; padding: 32px; background: white; font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.6; white-space: pre-wrap; }
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1d4ed8, #4338ca); }
    .login-card { background: white; border-radius: 20px; padding: 40px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    /* Mobile nav */
    #mobile-bar { display: none; position: fixed; top: 0; left: 0; right: 0; height: 52px; background: #1e3a8a; align-items: center; padding: 0 12px; gap: 8px; z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    #mobile-bar span { color: white; font-weight: 700; font-size: 16px; flex: 1; }
    #hamburger { background: none; border: none; color: white; font-size: 26px; cursor: pointer; padding: 4px; line-height: 1; }
    #mobile-back { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 13px; font-weight: 600; cursor: pointer; padding: 5px 10px; border-radius: 6px; white-space: nowrap; }
    #nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 150; }
    @media (max-width: 700px) {
      .grid2 { grid-template-columns: 1fr; }
      .grid3 { grid-template-columns: 1fr 1fr; }
      .main { margin-left: 0 !important; padding: 16px; padding-top: 68px; }
      .sidebar { transform: translateX(-210px); transition: transform 0.25s; z-index: 160; }
      .sidebar.open { transform: translateX(0); }
      #mobile-bar { display: flex; }
      #nav-overlay.show { display: block; }
